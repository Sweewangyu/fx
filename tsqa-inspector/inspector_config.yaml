# TSQA Lens configuration. Relative paths are resolved from this file.
data:
  root: ../datataste
  registry: ../datataste/data/versions/datav2/sources.json
  template_stats: ../SFT_CURATOR/template_stats.json

  # Optional merged sidecars generated by SFT_CURATOR/merge_tsqa_annotations.py.
  # On the server these provide ability / quality / difficulty without copying
  # the original time-series arrays.
  annotations_dir: ../SFT_CURATOR/merged_labels/annotations

  # Optional official TSRBench root. The inspector discovers all available
  # task JSONL files recursively. Missing roots are simply ignored.
  # 官方仓库运行 download_data.py 后生成 dataset/。这里支持候选路径；
  # 也可启动前 export TSRBENCH_ROOT=/实际绝对路径/dataset 覆盖。
  tsrbench_root:
    - ../TSRBench/dataset
    - ../TSRBenchmark/dataset
    - ../ChatTS-Training/TSRBench/dataset

qwen:
  base_url: http://10.112.164.1:30001/v1
  model: /share/global/pymaip/models/Qwen3.6-27B
  api_key_env: DT_QWEN_API_KEY
  allow_no_key: true
  timeout_seconds: 180
  # 当前Qwen服务的标注脚本使用1024；翻译先给2048，HTTP 400时自动降至
  # 1024并去掉response_format兼容参数重试一次。
  max_tokens: 2048
  compatibility_retry: true

server:
  host: 0.0.0.0
  port: 8765
  cache_dir: .cache
  # The service has no mutating endpoint and is normally reached from another
  # machine's browser, so allow the frontend hostname used by the cluster.
  frontend_origin: "*"
  max_chart_points: 900
  template_page_size: 12
