="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="240" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p3</text><rect x="273" y="466" width="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="299" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p4</text><text x="312" y="493" font-size="19" font-weight="700" fill="#8A98AA" text-anchor="start" >…</text><text x="96" y="522" font-size="15" font-weight="700" fill="#3278E8" text-anchor="start" >Nᵢ = ⌈Lᵢ / 8⌉</text><path d="M 360 352 L 405 352" fill="none" stroke="#3278E8" stroke-width="2.5"  marker-end="url(#blueArrow)"/><rect x="405" y="178" width="790" height="350" rx="18" fill="#FFF1E7" stroke="#F2C9A9" stroke-width="1.5" filter="url(#shadow)"/><text x="423" y="209" font-size="19" font-weight="750" fill="#10213B" text-anchor="start" >TimeMixer++：多尺度 × 多分辨率时频模式机</text><rect x="1099" y="190" width="78" height="34" rx="17" fill="#FFFFFF" stroke="#F2C9A9" stroke-width="1" /><text x="1138" y="213" font-size="15" font-weight="700" fill="#E47A2B" text-anchor="middle" >边界</text><text x="445" y="238" font-size="14" font-weight="750" fill="#52637A" text-anchor="start" >Multi-scale inputs → multi-resolution time images</text><rect x="445" y="255" width="48" height="35" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="469" y="288" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" ></text><rect x="499" y="255" width="48" height="35" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="523" y="288" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" ></text><rect x="553" y="255" width="48" height="35" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="577" y="288" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" ></text><rect x="607" y="255" width="48" height="35" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="631" y="288" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" ></text><rect x="661" y="255" width="48" height="35" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="685" y="288" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" ></text><rect x="715" y="255" width="48" height="35" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="739" y="288" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" ></text><rect x="445" y="304" width="80" height="35" rx="12" fill="#E8F8FB" stroke="#A9DDE7" stroke-width="1.5" /><text x="485" y="337" font-size="17" font-weight="750" fill="#118BA3" text-anchor="middle" ></text><rect x="537" y="304" width="80" height="35" rx="12" fill="#E8F8FB" stroke="#A9DDE7" stroke-width="1.5" /><text x="577" y="337" font-size="17" font-weight="750" fill="#118BA3" text-anchor="middle" ></text><rect x="629" y="304" width="80" height="35" rx="12" fill="#E8F8FB" stroke="#A9DDE7" stroke-width="1.5" /><text x="669" y="337" font-size="17" font-weight="750" fill="#118BA3" text-anchor="middle" ></text><rect x="445" y="353" width="132" height="35" rx="12" fill="#F0ECFF" stroke="#C9BCF4" stroke-width="1.5" /><text x="511" y="386" font-size="17" font-weight="750" fill="#7357D9" text-anchor="middle" ></text><rect x="591" y="353" width="132" height="35" rx="12" fill="#F0ECFF" stroke="#C9BCF4" stroke-width="1.5" /><text x="657" y="386" font-size="17" font-weight="750" fill="#7357D9" text-anchor="middle" ></text><path d="M 760 323 L 806 323" fill="none" stroke="#E47A2B" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="815" y="236" width="160" height="174" rx="18" fill="#FFF1E7" stroke="#F2C9A9" stroke-width="1.5" /><text x="895" y="268" font-size="19" font-weight="820" fill="#E47A2B" text-anchor="middle" >MRTI</text><text x="895" y="295" font-size="14" font-weight="700" fill="#10213B" text-anchor="middle" >FFT / Top-K</text><rect x="852" y="318" width="17" height="16" rx="3" fill="#7357D9" opacity="0.25"/><rect x="875" y="318" width="17" height="16" rx="3" fill="#E47A2B" opacity="0.37"/><rect x="898" y="318" width="17" height="16" rx="3" fill="#7357D9" opacity="0.49"/><rect x="921" y="318" width="17" height="16" rx="3" fill="#E47A2B" opacity="0.61"/><rect x="852" y="340" width="17" height="16" rx="3" fill="#E47A2B" opacity="0.37"/><rect x="875" y="340" width="17" height="16" rx="3" fill="#7357D9" opacity="0.49"/><rect x="898" y="340" width="17" height="16" rx="3" fill="#E47A2B" opacity="0.61"/><rect x="921" y="340" width="17" height="16" rx="3" fill="#7357D9" opacity="0.73"/><rect x="852" y="362" width="17" height="16" rx="3" fill="#7357D9" opacity="0.49"/><rect x="875" y="362" width="17" height="16" rx="3" fill="#E47A2B" opacity="0.61"/><rect x="898" y="362" width="17" height="16" rx="3" fill="#7357D9" opacity="0.73"/><rect x="921" y="362" width="17" height="16" rx="3" fill="#E47A2B" opacity="0.85"/><path d="M 978 323 L 1018 323" fill="none" stroke="#E47A2B" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1026" y="236" width="124" height="174" rx="18" fill="#F0ECFF" stroke="#CFC4F8" stroke-width="1.5" /><text x="1088" y="268" font-size="19" font-weight="820" fill="#7357D9" text-anchor="middle" >TID</text><text x="1088" y="299" font-size="13.5" font-weight="700" fill="#7357D9" text-anchor="middle" >seasonal</text><text x="1088" y="324" font-size="20" font-weight="800" fill="#8A98AA" text-anchor="middle" >↕</text><text x="1088" y="352" font-size="13.5" font-weight="700" fill="#3278E8" text-anchor="middle" >trend</text><text x="1088" y="384" font-size="12.5" font-weight="750" fill="#10213B" text-anchor="middle" >MCM + MRM</text><rect x="445" y="438" width="705" height="60" rx="14" fill="#FFF0F2" stroke="#F2BAC2" stroke-width="1.2" /><text x="797" y="464" font-size="15" font-weight="700" fill="#D64A5B" text-anchor="middle" >需要：finest-scale select/fuse → re-align to N tokens → dLLM</text><text x="797" y="487" font-size="13.5" font-weight="650" fill="#52637A" text-anchor="middle" >已经不是“仅替换 MLP block”</text><path d="M 1195 352 L 1235 352" fill="none" stroke="#168B67" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="1240" y="178" width="286" height="350" rx="18" fill="#E8F7F1" stroke="#BCE5D5" stroke-width="1.5" filter="url(#shadow)"/><text x="1258" y="209" font-size="19" font-weight="750" fill="#10213B" text-anchor="start" >统一输出接口</text><rect x="1430" y="190" width="78" height="34" rx="17" fill="#FFFFFF" stroke="#BCE5D5" stroke-width="1" /><text x="1469" y="213" font-size="15" font-weight="700" fill="#168B67" text-anchor="middle" >保留</text><text x="1258" y="239" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >不改 processor / placeholder</text><text x="1258" y="262" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >不改 LLM token merge</text><rect x="1264" y="268" width="238" height="58" rx="14" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1383" y="292" font-size="15.5" font-weight="750" fill="#168B67" text-anchor="middle" >额外对齐 adapter</text><text x="1383" y="315" font-size="15" font-weight="650" fill="#52637A" text-anchor="middle" >dₜₛ → dLLM</text><rect x="1274" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1297" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p1</text><rect x="1326" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1349" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p2</text><rect x="1378" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1401" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p3</text><rect x="1430" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1453" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p4</text><text x="1264" y="418" font-size="15.5" font-weight="700" fill="#10213B" text-anchor="start" >E ∈ ℝ^(ΣNᵢ × dLLM)</text><text x="1264" y="445" font-size="14.5" font-weight="600" fill="#52637A" text-anchor="start" >patch_cnt = [N₁, …, Nᴮ]</text><rect x="1264" y="466" width="238" height="42" rx="12" fill="url(#llmGrad)"/><text x="1383" y="493" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle" >插入文本 token → LLM</text>
  <rect x="72" y="682" width="1454" height="105" rx="20" fill="#F8FAFD" stroke="#D9E2EF" stroke-width="1.3"/>
  <rect x="94" y="704" width="112" height="34" rx="17" fill="#E47A2B18" stroke="none" stroke-width="1" /><text x="150" y="727" font-size="15" font-weight="700" fill="#E47A2B" text-anchor="middle" >核心差异</text>
  <text x="228" y="728" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >TimeMixer++ 的贡献来自 MRTI、TID、MCM、MRM 的整套协同，不应裁成一个名字相同但机制消失的 block。</text><text x="228" y="755" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >它会引入 FFT、Top-K period、2D reshape、多尺度融合与 token 重对齐，本轮应明确排除。</text>
