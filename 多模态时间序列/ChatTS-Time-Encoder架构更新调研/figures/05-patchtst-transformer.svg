ll="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="705" y="288" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p4</text><rect x="749" y="255" width="64" height="48" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="781" y="288" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p5</text><rect x="825" y="255" width="64" height="48" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="857" y="288" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p6</text><path d="M 850 279 L 890 279" fill="none" stroke="#3278E8" stroke-width="2.3"  marker-end="url(#blueArrow)"/><rect x="900" y="222" width="250" height="232" rx="18" fill="#FAF8FF" stroke="#CFC4F8" stroke-width="1.5" /><text x="1025" y="252" font-size="18" font-weight="800" fill="#7357D9" text-anchor="middle" >Transformer Encoder × K</text><circle cx="945" cy="306" r="11" fill="#EAF2FF" stroke="#3278E8" stroke-width="2"/><circle cx="985" cy="306" r="11" fill="#EAF2FF" stroke="#3278E8" stroke-width="2"/><circle cx="1025" cy="306" r="11" fill="#EAF2FF" stroke="#3278E8" stroke-width="2"/><circle cx="1065" cy="306" r="11" fill="#EAF2FF" stroke="#3278E8" stroke-width="2"/><circle cx="1105" cy="306" r="11" fill="#EAF2FF" stroke="#3278E8" stroke-width="2"/><path d="M 945 306 Q 965 265 985 306" fill="none" stroke="#7357D9" stroke-width="1.2" opacity=".5"/><path d="M 945 306 Q 985 260 1025 306" fill="none" stroke="#7357D9" stroke-width="1.2" opacity=".5"/><path d="M 945 306 Q 1005 255 1065 306" fill="none" stroke="#7357D9" stroke-width="1.2" opacity=".5"/><path d="M 945 306 Q 1025 250 1105 306" fill="none" stroke="#7357D9" stroke-width="1.2" opacity=".5"/><path d="M 985 306 Q 1005 265 1025 306" fill="none" stroke="#7357D9" stroke-width="1.2" opacity=".5"/><path d="M 985 306 Q 1025 260 1065 306" fill="none" stroke="#7357D9" stroke-width="1.2" opacity=".5"/><path d="M 985 306 Q 1045 255 1105 306" fill="none" stroke="#7357D9