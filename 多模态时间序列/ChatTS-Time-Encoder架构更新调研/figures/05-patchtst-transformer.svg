chor="start" >不改 LLM token merge</text><rect x="1264" y="268" width="238" height="58" rx="14" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1383" y="292" font-size="15.5" font-weight="750" fill="#168B67" text-anchor="middle" >Token projector</text><text x="1383" y="315" font-size="15" font-weight="650" fill="#52637A" text-anchor="middle" >dₜₛ → dLLM</text><rect x="1274" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1297" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p1</text><rect x="1326" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1349" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p2</text><rect x="1378" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1401" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p3</text><rect x="1430" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1453" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p4</text><text x="1264" y="418" font-size="15.5" font-weight="700" fill="#10213B" text-anchor="start" >E ∈ ℝ^(ΣNᵢ × dLLM)</text><text x="1264" y="445" font-size="14.5" font-weight="600" fill="#52637A" text-anchor="start" >patch_cnt = [N₁, …, Nᴮ]</text><rect x="1264" y="466" width="238" height="42" rx="12" fill="url(#llmGrad)"/><text x="1383" y="493" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle" >插入文本 token → LLM</text>
  <rect x="72" y="682" width="1454" height="105" rx="20" fill="#F8FAFD" stroke="#D9E2EF" stroke-width="1.3"/>
  <rect x="94" y="704" width="112" height="34" rx="17" fill="#3278E818" stroke="none" stroke-width="1" /><text x="150" y="727" font-size="15" font-weight="700" fill="#3278E8" text-anchor="middle" >核心差异</text>
  <text x="228" y="728" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >它是验证“跨 patch temporal mixing 是否有效”的干净强基线：全局交互最直接，改动也小。</text><text x="228" y="755" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >若它与 ModernTCN-lite 接近，优先选择线性复杂度、纯 PyTorch 的 ModernTCN-lite。</text>
