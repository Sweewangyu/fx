t="700" fill="#7357D9" text-anchor="start" >weights</text><rect x="785" y="482" width="350" height="34" rx="17" fill="#FFF0F2" stroke="none" stroke-width="1" /><text x="960" y="505" font-size="15" font-weight="700" fill="#D64A5B" text-anchor="middle" >patch 间没有任何连线</text><path d="M 1195 352 L 1235 352" fill="none" stroke="#168B67" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1240" y="178" width="286" height="350" rx="18" fill="#E8F7F1" stroke="#BCE5D5" stroke-width="1.5" filter="url(#shadow)"/><text x="1258" y="209" font-size="19" font-weight="750" fill="#10213B" text-anchor="start" >统一输出接口</text><rect x="1430" y="190" width="78" height="34" rx="17" fill="#FFFFFF" stroke="#BCE5D5" stroke-width="1" /><text x="1469" y="213" font-size="15" font-weight="700" fill="#168B67" text-anchor="middle" >保留</text><text x="1258" y="239" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >不改 processor / placeholder</text><text x="1258" y="262" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >不改 LLM token merge</text><rect x="1264" y="268" width="238" height="58" rx="14" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1383" y="292" font-size="15.5" font-weight="750" fill="#168B67" text-anchor="middle" >MLP output</text><text x="1383" y="315" font-size="15" font-weight="650" fill="#52637A" text-anchor="middle" >dₜₛ → dLLM</text><rect x="1274" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1297" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p1</text><rect x="1326" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1349" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p2</text><rect x="1378" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1401" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p3</text><rect x="1430" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1453" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p4</text><text x="1264" y="418" font-size="15.5" font-weight="700" fill="#10213B" text-anchor="start" >E ∈ ℝ^(ΣNᵢ × dLLM)</text><text x="1264" y="445" font-size="14.5" font-weight="600" fill="#52637A" text-anchor="start" >patch_cnt = [N₁, …, Nᴮ]</text><rect x="1264" y="466" width="238" height="42" rx="12" fill="url(#llmGrad)"/><text x="1383" y="493" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle" >插入文本 token → LLM</text><path d="M 508 522 C 640 565, 950 565, 1075 522" fill="none" stroke="#D64A5B" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="635" y="548" width="320" height="34" rx="17" fill="#FFF0F2" stroke="none" stroke-width="1" /><text x="795" y="571" font-size="15" font-weight="700" fill="#D64A5B" text-anchor="middle" >跨 patch 依赖被推迟到 LLM 内</text>
  <rect x="72" y="682" width="1454" height="105" rx="20" fill="#F8FAFD" stroke="#D9E2EF" stroke-width="1.3"/>
  <rect x="94" y="704" width="112" height="34" rx="17" fill="#D64A5B18" stroke="none" stroke-width="1" /><text x="150" y="727" font-size="15" font-weight="700" fill="#D64A5B" text-anchor="middle" >核心差异</text>
  <text x="228" y="728" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >同一 patch 内可以做非线性映射，但在进入 LLM 之前，p₁…pN 彼此不可见。</text><text x="228" y="755" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >因此真正的时间依赖建模被全部交给了 LLM；这正是最值得更新的结构缺口。</text>
