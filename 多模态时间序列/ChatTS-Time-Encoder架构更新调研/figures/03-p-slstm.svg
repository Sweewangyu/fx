  <text x="174" y="82" font-size="32" font-weight="820" fill="#10213B" text-anchor="start" >P-sLSTM：2025 年原生时序的递归替代</text>
  <text x="174" y="116" font-size="17" font-weight="520" fill="#52637A" text-anchor="start" >固定 patch → stacked sLSTM → 每个 patch hidden state；明确地沿时间顺序传递状态</text>
  <rect x="1328" y="63" width="188" height="34" rx="17" fill="#E8F7F1" stroke="none" stroke-width="1" /><text x="1422" y="86" font-size="15" font-weight="700" fill="#168B67" text-anchor="middle" >RECOMMEND #2 · AAAI 2025</text>
  <rect x="72" y="178" width="288" height="350" rx="18" fill="#EAF2FF" stroke="#BDD4FA" stroke-width="1.5" filter="url(#shadow)"/><text x="90" y="209" font-size="19" font-weight="750" fill="#10213B" text-anchor="start" >统一输入接口</text><rect x="264" y="190" width="78" height="34" rx="17" fill="#FFFFFF" stroke="#BDD4FA" stroke-width="1" /><text x="303" y="213" font-size="15" font-weight="700" fill="#3278E8" text-anchor="middle" >固定</text><text x="90" y="239" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >单条变长时序 + mask</text><text x="90" y="262" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >仅有效点参与 patchify</text><line x1="96" y1="332" x2="336" y2="332" stroke="#D9E2EF" stroke-width="1"/>
  <polyline points="96,317.04 112.8,311.76 127.2,320.56 144,281.84 160.8,329.36 177.60000000000002,314.4 196.8,308.24 211.2,316.15999999999997 228,294.16 244.8,302.96 261.6,285.36 278.4,323.2 295.2,311.76 312,317.04 336,292.4" fill="none" stroke="#3278E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="382" font-size="14" font-weight="700" fill="#3278E8" text-anchor="start" >value</text><text x="96" y="408" font-size="14" font-weight="700" fill="#52637A" text-anchor="start" >mask</text><rect x="144" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="159" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="174" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="189" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="204" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="219" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="234" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="249" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="264" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="279" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="294" y="394" width="10" height="12" rx="2" fill="#DCE3EC"/><rect x="309" y="394" width="10" height="12" rx="2" fill="#DCE3EC"/><text x="96" y="446" font-size="16" font-weight="750" fill="#10213B" text-anchor="start" >Patchify</text><text x="184" y="446" font-size="15" font-weight="600" fill="#52637A" text-anchor="start" >p = 8, stride = 8</text><rect x="96" y="466" width="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="122" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p1</text><rect x="155" y="466" width="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="181" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p2</text><rect x="214" y="466" width="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="240" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p3</text><rect x="273" y="466" width="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="299" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p4</text><text x="312" y="493" font-size="19" font-weight="700" fill="#8A98AA" text-anchor="start" >…</text><text x="96" y="522" font-size="15" font-weight="700" fill="#3278E8" text-anchor="start" >Nᵢ = ⌈Lᵢ / 8⌉</text><path d="M 360 352 L 405 352" fill="none" stroke="#3278E8" stroke-width="2.5"  marker-end="url(#blueArrow)"/><rect x="405" y="178" width="790" height="350" rx="18" fill="#F0ECFF" stroke="#CFC4F8" stroke-width="1.5" filter="url(#shadow)"/><text x="423" y="209" font-size="19" font-weight="750" fill="#10213B" text-anchor="start" >P-sLSTM：patch 级稳定递归状态</text><rect x="1099" y="190" width="78" height="34" rx="17" fill="#FFFFFF" stroke="#CFC4F8" stroke-width="1" /><text x="1138" y="213" font-size="15" font-weight="700" fill="#7357D9" text-anchor="middle" >推荐 ②</text><text x="423" y="239" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >每个 patch 读取前一状态；指数门控 + normalizer</text><rect x="445" y="290" width="98" height="105" rx="18" fill="#F0ECFF" stroke="#CFC4F8" stroke-width="1.5" /><text x="494" y="320" font-size="17" font-weight="800" fill="#3278E8" text-anchor="middle" >p1</text><text x="494" y="349" font-size="16" font-weight="800" fill="#7357D9" text-anchor="middle" >sLSTM</text><text x="494" y="375" font-size="13.5" font-weight="650" fill="#52637A" text-anchor="middle" >c, n, h</text><path d="M 545 343 L 585 343" fill="none" stroke="#7357D9" stroke-width="2.8"  marker-end="url(#violetArrow)"/><text x="565" y="329" font-size="12.5" font-weight="700" fill="#7357D9" text-anchor="middle" >state</text><rect x="590" y="290" width="98" height="105" rx="18" fill="#F0ECFF" stroke="#CFC4F8" stroke-width="1.5" /><text x="639" y="320" font-size="17" font-weight="800" fill="#3278E8" text-anchor="middle" >p2</text><text x="639" y="349" font-size="16" font-weight="800" fill="#7357D9" text-anchor="middle" >sLSTM</text><text x="639" y="375" font-size="13.5" font-weight="650" fill="#52637A" text-anchor="middle" >c, n, h</text><path d="M 690 343 L 730 343" fill="none" stroke="#7357D9" stroke-width="2.8"  marker-end="url(#violetArrow)"/><text x="710" y="329" font-size="12.5" font-weight="700" fill="#7357D9" text-anchor="middle" >state</text><rect x="735" y="290" width="98" height="105" rx="18" fill="#F0ECFF" stroke="#CFC4F8" stroke-width="1.5" /><text x="784" y="320" font-size="17" font-weight="800" fill="#3278E8" text-anchor="middle" >p3</text><text x="784" y="349" font-size="16" font-weight="800" fill="#7357D9" text-anchor="middle" >sLSTM</text><text x="784" y="375" font-size="13.5" font-weight="650" fill="#52637A" text-anchor="middle" >c, n, h</text><path d="M 835 343 L 875 343" fill="none" stroke="#7357D9" stroke-width="2.8"  marker-end="url(#violetArrow)"/><text x="855" y="329" font-size="12.5" font-weight="700" fill="#7357D9" text-anchor="middle" >state</text><rect x="880" y="290" width="98" height="105" rx="18" fill="#F0ECFF" stroke="#CFC4F8" stroke-width="1.5" /><text x="929" y="320" font-size="17" font-weight="800" fill="#3278E8" text-anchor="middle" >p4</text><text x="929" y="349" font-size="16" font-weight="800" fill="#7357D9" text-anchor="middle" >sLSTM</text><text x="929" y="375" font-size="13.5" font-weight="650" fill="#52637A" text-anchor="middle" >c, n, h</text><path d="M 980 343 L 1020 343" fill="none" stroke="#7357D9" stroke-width="2.8"  marker-end="url(#violetArrow)"/><text x="1000" y="329" font-size="12.5" font-weight="700" fill="#7357D9" text-anchor="middle" >state</text><rect x="1025" y="290" width="98" height="105" rx="18" fill="#F0ECFF" stroke="#CFC4F8" stroke-width="1.5" /><text x="1074" y="320" font-size="17" font-weight="800" fill="#3278E8" text-anchor="middle" >p5</text><text x="1074" y="349" font-size="16" font-weight="800" fill="#7357D9" text-anchor="middle" >sLSTM</text><text x="1074" y="375" font-size="13.5" font-weight="650" fill="#52637A" text-anchor="middle" >c, n, h</text><rect x="445" y="250" width="224" height="34" rx="17" fill="#EAF2FF" stroke="none" stroke-width="1" /><text x="557" y="273" font-size="15" font-weight="700" fill="#3278E8" text-anchor="middle" >fixed patch sequence</text><rect x="687" y="250" width="438" height="34" rx="17" fill="#F0ECFF" stroke="none" stroke-width="1" /><text x="906" y="273" font-size="15" font-weight="700" fill="#7357D9" text-anchor="middle" >按时间顺序传播：hₜ₋₁ → hₜ</text><rect x="460" y="429" width="650" height="67" rx="14" fill="#FAF8FF" stroke="#D8CFF8" stroke-width="1.2" /><text x="785" y="454" font-size="13" font-weight="750" fill="#8A98AA" text-anchor="middle" >cell update</text><text x="785" y="480" font-size="17" font-weight="700" fill="#7357D9" text-anchor="middle" class="mono">cₜ = fₜ⊙cₜ₋₁ + iₜ⊙zₜ     ·     hₜ = oₜ⊙(cₜ / nₜ)</text><path d="M 1195 352 L 1235 352" fill="none" stroke="#168B67" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1240" y="178" width="286" height="350" rx="18" fill="#E8F7F1" stroke="#BCE5D5" stroke-width="1.5" filter="url(#shadow)"/><text x="1258" y="209" font-size="19" font-weight="750" fill="#10213B" text-anchor="start" >统一输出接口</text><rect x="1430" y="190" width="78" height="34" rx="17" fill="#FFFFFF" stroke="#BCE5D5" stroke-width="1" /><text x="1469" y="213" font-size="15" font-weight="700" fill="#168B67" text-anchor="middle" >保留</text><text x="1258" y="239" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >不改 processor / placeholder</text><text x="1258" y="262" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >不改 LLM token merge</text><rect x="1264" y="268" width="238" height="58" rx="14" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1383" y="292" font-size="15.5" font-weight="750" fill="#168B67" text-anchor="middle" >Token projector</text><text x="1383" y="315" font-size="15" font-weight="650" fill="#52637A" text-anchor="middle" >dₜₛ → dLLM</text><rect x="1274" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1297" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p1</text><rect x="1326" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1349" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p2</text><rect x="1378" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1401" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p3</text><rect x="1430" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1453" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p4</text><text x="1264" y="418" font-size="15.5" font-weight="700" fill="#10213B" text-anchor="start" >E ∈ ℝ^(ΣNᵢ × dLLM)</text><text x="1264" y="445" font-size="14.5" font-weight="600" fill="#52637A" text-anchor="start" >patch_cnt = [N₁, …, Nᴮ]</text><rect x="1264" y="466" width="238" height="42" rx="12" fill="url(#llmGrad)"/><text x="1383" y="493" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle" >插入文本 token → LLM</text>
  <rect x="72" y="682" width="1454" height="105" rx="20" fill="#F8FAFD" stroke="#D9E2EF" stroke-width="1.3"/>
  <rect x="94" y="704" width="112" height="34" rx="17" fill="#7357D918" stroke="none" stroke-width="1" /><text x="150" y="727" font-size="15" font-weight="700" fill="#7357D9" text-anchor="middle" >核心差异</text>
  <text x="228" y="728" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >与 MLP 的关键差别不是“层更多”，而是显式携带 (c, n, h) 状态从 patch t 传播到 t+1。</text><text x="228" y="755" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >结构新、接口贴合，但官方实现依赖 xLSTM/CUDA/ninja，工程风险高于纯 Conv1d。</text>
