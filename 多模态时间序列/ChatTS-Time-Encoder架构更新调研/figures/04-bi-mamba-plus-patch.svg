<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bi-Mamba+ Patch Encoder：双向状态空间方案</title>
  <desc id="desc">沿 temporal patch 轴做正向与反向 selective scan；保持 N 个输出 token</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1E365D" flood-opacity=".08"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="headerGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#E47A2B" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7357D9" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#18365F"/>
      <stop offset="1" stop-color="#101F36"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#52637A"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3278E8"/>
    </marker>
    <marker id="violetArrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7357D9"/>
    </marker>
    <style>
      text { font-family: Inter, "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", monospace; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F3F7FC"/>
  <circle cx="1365" cy="85" r="155" fill="#E47A2B" opacity=".06" filter="url(#soft)"/>
  <rect x="34" y="28" width="1532" height="844" rx="30" fill="#FFFFFF" stroke="#D9E2EF" stroke-width="1.4"/>
  <rect x="34" y="28" width="1532" height="118" rx="30" fill="url(#headerGlow)"/>
  <rect x="34" y="116" width="1532" height="30" fill="#FFFFFF" opacity=".5"/>
  <rect x="72" y="58" width="82" height="34" rx="17" fill="#15263F" stroke="none" stroke-width="1" /><text x="113" y="81" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" >FIG 04</text>
  <text x="174" y="82" font-size="32" font-weight="820" fill="#10213B" text-anchor="start" >Bi-Mamba+ Patch Encoder：双向状态空间方案</text>
  <text x="174" y="116" font-size="17" font-weight="520" fill="#52637A" text-anchor="start" >沿 temporal patch 轴做正向与反向 selective scan；保持 N 个输出 token</text>
  <rect x="1328" y="63" width="188" height="34" rx="17" fill="#FFF1E7" stroke="none" stroke-width="1" /><text x="1422" y="86" font-size="15" font-weight="700" fill="#E47A2B" text-anchor="middle" >RECOMMEND #3 · PREPRINT</text>
  <rect x="72" y="178" width="288" height="350" rx="18" fill="#EAF2FF" stroke="#BDD4FA" stroke-width="1.5" filter="url(#shadow)"/><text x="90" y="209" font-size="19" font-weight="750" fill="#10213B" text-anchor="start" >统一输入接口</text><rect x="264" y="190" width="78" height="34" rx="17" fill="#FFFFFF" stroke="#BDD4FA" stroke-width="1" /><text x="303" y="213" font-size="15" font-weight="700" fill="#3278E8" text-anchor="middle" >固定</text><text x="90" y="239" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >单条变长时序 + mask</text><text x="90" y="262" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >仅有效点参与 patchify</text><line x1="96" y1="332" x2="336" y2="332" stroke="#D9E2EF" stroke-width="1"/>
  <polyline points="96,317.04 112.8,311.76 127.2,320.56 144,281.84 160.8,329.36 177.60000000000002,314.4 196.8,308.24 211.2,316.15999999999997 228,294.16 244.8,302.96 261.6,285.36 278.4,323.2 295.2,311.76 312,317.04 336,292.4" fill="none" stroke="#3278E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="382" font-size="14" font-weight="700" fill="#3278E8" text-anchor="start" >value</text><text x="96" y="408" font-size="14" font-weight="700" fill="#52637A" text-anchor="start" >mask</text><rect x="144" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="159" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="174" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="189" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="204" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="219" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="234" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="249" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="264" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="279" y="394" width="10" height="12" rx="2" fill="#168B67"/><rect x="294" y="394" width="10" height="12" rx="2" fill="#DCE3EC"/><rect x="309" y="394" width="10" height="12" rx="2" fill="#DCE3EC"/><text x="96" y="446" font-size="16" font-weight="750" fill="#10213B" text-anchor="start" >Patchify</text><text x="184" y="446" font-size="15" font-weight="600" fill="#52637A" text-anchor="start" >p = 8, stride = 8</text><rect x="96" y="466" width="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="122" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p1</text><rect x="155" y="466" width="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="181" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p2</text><rect x="214" y="466" width="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="240" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p3</text><rect x="273" y="466" width="52" height="42" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="299" y="499" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p4</text><text x="312" y="493" font-size="19" font-weight="700" fill="#8A98AA" text-anchor="start" >…</text><text x="96" y="522" font-size="15" font-weight="700" fill="#3278E8" text-anchor="start" >Nᵢ = ⌈Lᵢ / 8⌉</text><path d="M 360 352 L 405 352" fill="none" stroke="#3278E8" stroke-width="2.5"  marker-end="url(#blueArrow)"/><rect x="405" y="178" width="790" height="350" rx="18" fill="#F0ECFF" stroke="#CFC4F8" stroke-width="1.5" filter="url(#shadow)"/><text x="423" y="209" font-size="19" font-weight="750" fill="#10213B" text-anchor="start" >Bi-Mamba+ Patch Encoder：双向选择性状态扫描</text><rect x="1099" y="190" width="78" height="34" rx="17" fill="#FFFFFF" stroke="#CFC4F8" stroke-width="1" /><text x="1138" y="213" font-size="15" font-weight="700" fill="#7357D9" text-anchor="middle" >推荐 ③</text><text x="423" y="239" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >沿 temporal patches 双向扫描，并保留 N 个输出状态</text><rect x="445" y="250" width="64" height="48" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="477" y="283" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p1</text><rect x="521" y="250" width="64" height="48" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="553" y="283" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p2</text><rect x="597" y="250" width="64" height="48" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="629" y="283" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p3</text><rect x="673" y="250" width="64" height="48" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="705" y="283" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p4</text><rect x="749" y="250" width="64" height="48" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="781" y="283" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p5</text><rect x="825" y="250" width="64" height="48" rx="12" fill="#EAF2FF" stroke="#AFCBF6" stroke-width="1.5" /><text x="857" y="283" font-size="17" font-weight="750" fill="#3278E8" text-anchor="middle" >p6</text><text x="445" y="336" font-size="14" font-weight="750" fill="#7357D9" text-anchor="start" >Forward scan</text><path d="M 560 330 L 1055 330" fill="none" stroke="#7357D9" stroke-width="4"  marker-end="url(#violetArrow)"/><polygon points="1055,322 1071,330 1055,338" fill="#7357D9"/><circle cx="495" cy="330" r="7" fill="#7357D9"/><circle cx="596" cy="330" r="7" fill="#7357D9"/><circle cx="697" cy="330" r="7" fill="#7357D9"/><circle cx="798" cy="330" r="7" fill="#7357D9"/><circle cx="899" cy="330" r="7" fill="#7357D9"/><circle cx="1000" cy="330" r="7" fill="#7357D9"/><text x="445" y="397" font-size="14" font-weight="750" fill="#E47A2B" text-anchor="start" >Backward scan</text><path d="M 1055 390 L 560 390" fill="none" stroke="#E47A2B" stroke-width="4"  marker-end="url(#arrow)"/><polygon points="560,382 544,390 560,398" fill="#E47A2B"/><circle cx="495" cy="390" r="7" fill="#E47A2B"/><circle cx="596" cy="390" r="7" fill="#E47A2B"/><circle cx="697" cy="390" r="7" fill="#E47A2B"/><circle cx="798" cy="390" r="7" fill="#E47A2B"/><circle cx="899" cy="390" r="7" fill="#E47A2B"/><circle cx="1000" cy="390" r="7" fill="#E47A2B"/><rect x="445" y="431" width="690" height="70" rx="14" fill="#FAF8FF" stroke="#D8CFF8" stroke-width="1.2" /><text x="465" y="458" font-size="14" font-weight="800" fill="#7357D9" text-anchor="start" >Mamba+ 内核</text><text x="465" y="484" font-size="14.5" font-weight="650" fill="#10213B" text-anchor="start" >Conv1D → SiLU → selective SSM → forget-gated merge → residual FFN</text><rect x="884" y="446" width="226" height="34" rx="17" fill="#FFF1E7" stroke="none" stroke-width="1" /><text x="997" y="469" font-size="15" font-weight="700" fill="#E47A2B" text-anchor="middle" >scan axis = N patches</text><path d="M 1118 330 C 1160 342, 1160 378, 1118 390" fill="none" stroke="#168B67" stroke-width="2.8"  marker-end="url(#arrow)"/><text x="1165" y="365" font-size="21" font-weight="800" fill="#168B67" text-anchor="middle" >Σ</text><path d="M 1195 352 L 1235 352" fill="none" stroke="#168B67" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1240" y="178" width="286" height="350" rx="18" fill="#E8F7F1" stroke="#BCE5D5" stroke-width="1.5" filter="url(#shadow)"/><text x="1258" y="209" font-size="19" font-weight="750" fill="#10213B" text-anchor="start" >统一输出接口</text><rect x="1430" y="190" width="78" height="34" rx="17" fill="#FFFFFF" stroke="#BCE5D5" stroke-width="1" /><text x="1469" y="213" font-size="15" font-weight="700" fill="#168B67" text-anchor="middle" >保留</text><text x="1258" y="239" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >不改 processor / placeholder</text><text x="1258" y="262" font-size="15.5" font-weight="500" fill="#52637A" text-anchor="start" >不改 LLM token merge</text><rect x="1264" y="268" width="238" height="58" rx="14" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1383" y="292" font-size="15.5" font-weight="750" fill="#168B67" text-anchor="middle" >Token projector</text><text x="1383" y="315" font-size="15" font-weight="650" fill="#52637A" text-anchor="middle" >dₜₛ → dLLM</text><rect x="1274" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1297" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p1</text><rect x="1326" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1349" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p2</text><rect x="1378" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1401" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p3</text><rect x="1430" y="350" width="46" height="42" rx="12" fill="#E8F7F1" stroke="#A9DCC9" stroke-width="1.5" /><text x="1453" y="383" font-size="17" font-weight="750" fill="#168B67" text-anchor="middle" >p4</text><text x="1264" y="418" font-size="15.5" font-weight="700" fill="#10213B" text-anchor="start" >E ∈ ℝ^(ΣNᵢ × dLLM)</text><text x="1264" y="445" font-size="14.5" font-weight="600" fill="#52637A" text-anchor="start" >patch_cnt = [N₁, …, Nᴮ]</text><rect x="1264" y="466" width="238" height="42" rx="12" fill="url(#llmGrad)"/><text x="1383" y="493" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle" >插入文本 token → LLM</text>
  <rect x="72" y="682" width="1454" height="105" rx="20" fill="#F8FAFD" stroke="#D9E2EF" stroke-width="1.3"/>
  <rect x="94" y="704" width="112" height="34" rx="17" fill="#E47A2B18" stroke="none" stroke-width="1" /><text x="150" y="727" font-size="15" font-weight="700" fill="#E47A2B" text-anchor="middle" >核心差异</text>
  <text x="228" y="728" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >对 ChatTS 的接口几乎是天然 drop-in，并以 O(N) 状态扫描覆盖长依赖。</text><text x="228" y="755" font-size="17" font-weight="600" fill="#10213B" text-anchor="start" >但截至调研日仍是 arXiv；忠实 Mamba+ 还需要自定义 CUDA selective-scan，论文状态与依赖风险必须写清。</text>
