# ChatTS Chronos-2 full two-stage/evaluation or Stage1-only training.
# Inline environment variables still override values in this file.

pipeline:
  # full = Stage1 -> Stage2 -> evaluation (backward-compatible default)
  # stage1 = finalize and retain Stage1, then evaluate that Stage1 checkpoint
  pipeline_mode: full
  seed: 42
  force_train: false
  force_eval: false
  preflight_only: false
  max_samples: 0             # 0 = full evaluation
  offline: true
  # Dataset Studio writes both values into the immutable version manifest.
  # For a legacy data directory with no manifest, leave both values empty.
  data_version: null
  dataset_snapshot_hash: null

containers:
  training: chatts
  evaluation: ragas

training:
  project_root: /workspace/ChatTS-Training
  script: /workspace/ChatTS-Training/scripts/full/run_chronos2_best_two_stage.sh
  base_model_path: /share/airesearch/data/finiverse/model/ChatTS-Qwen3-8B
  output_root: /share/airesearch/data/finiverse/output/ChatTS-msxf-8B-datav1
  # Stage1-only mode can set a durable, recipe-specific destination here.
  # When omitted, it defaults to output_root/.stage1_seed<seed>_s1lr_<lr>.
  # stage1_model_path: /share/airesearch/data/finiverse/output/ChatTS-msxf-8B-datav1/best_stage1_seed42
  # Omit final_model_path to derive output_root/best_seed<seed> automatically.
  chronos2_model_path: /workspace/chronos2
  dataset_dir: /workspace/ChatTS-Training/data
  # false preserves the original one-click behavior; true is useful when the
  # Stage1 checkpoint will be reused by later Stage2-only experiments.
  keep_stage1: false
  deepspeed_include: "localhost:0,1,2,3,4,5,6,7"
  master_port: 19901

  stage1:
    learning_rate: "1e-5"
    # Defaults to learning_rate when omitted.
    timeseries_learning_rate: "1e-5"
    datasets: "align_256,ift"
    interleave_probs: "0.9,0.1"
    mix_strategy: interleave_over
    num_train_epochs: 3
    max_steps: 0
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 32
    lr_scheduler_type: cosine
    warmup_ratio: 0.02
    logging_steps: 1
    save_steps: 200
    eval_steps: 200
    val_size: 0.05
    per_device_eval_batch_size: 2
    cutoff_len: 2048
    preprocessing_num_workers: 96

  stage2:
    learning_rate: "1e-5"
    timeseries_learning_rate: "1e-5"
    datasets: "sft,align_random,finiverse_time_mqa,finiverse_tsaqa"
    interleave_probs: null
    mix_strategy: concat
    num_train_epochs: 1
    max_steps: 0
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 32
    lr_scheduler_type: cosine
    warmup_ratio: 0.02
    logging_steps: 1
    save_steps: 100
    eval_steps: 100
    val_size: 0.05
    per_device_eval_batch_size: 4
    cutoff_len: 2048
    preprocessing_num_workers: 96

evaluation:
  project_root: /workspace/ChatTS/ChatTS-main
  script: /workspace/ChatTS/ChatTS-main/scripts/run_all_chatts_benchmarks.sh
  # Dataset Studio writes these two derived fields. For a hand-written YAML,
  # omit them: the host runner derives the exact model and marker from mode.
  # model_path: /share/.../best_seed42
  # model_completion_marker: TRAINING_COMPLETE.json
  # Omit model_name/output_root to derive seed-specific defaults automatically.
  chronos2_model_path: /workspace/chronos2
  tsrbench_root: /share/airesearch/data/finiverse/TSRBench-dataset
  tinybench_dataset_root: /share/airesearch/data/finiverse/tyb
  ts_haystack_root: /workspace/TS-Haystack
  timeseriesexam_root: /workspace/TimeSeriesExam
  timeseriesexam_data_file: /workspace/TimeSeriesExam/output/round_3_folder/qa_dataset.json
  benchmarks: "tsrbench,tinybenchmarks,ts_haystack,timeseriesexam"
  # Omit protocol_hash to derive it from benchmark data, code, and arguments.
  run_id: chronos2-seed42-full
  haystack_split: test
  tiny_data_partition: all
  tiny_partition_seed: 42
  # Safe advanced controls. These are the historical runner defaults; omitting
  # them keeps old configuration files fully backward compatible.
  tsr_prompt_mode: answer_only
  tsr_max_model_len: 12288
  tsr_max_new_tokens: 8
  tsr_batch_size: 16
  tsr_request_chunk_size: 128
  tiny_max_model_len: 6000
  tiny_request_chunk_size: 16
  tiny_gpu_memory_utilization: "0.70"
  haystack_max_model_len: 40960
  haystack_max_new_tokens: 500
  haystack_batch_size: 1
  haystack_request_chunk_size: 8
  exam_max_model_len: 8192
  exam_max_new_tokens: 1024
  exam_batch_size: 8
  exam_request_chunk_size: 64
