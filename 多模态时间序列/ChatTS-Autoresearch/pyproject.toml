[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chatts-autoresearch"
version = "0.1.0"
description = "A black-box, resumable autoresearch controller for ChatTS Chronos-2 experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
chatts-autoresearch = "chatts_autoresearch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatts_autoresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Long SVG/JSON-schema/test-fixture literals are intentionally kept intact.
